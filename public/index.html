<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Sync — Backup Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHJlY3Qgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNiIgZmlsbD0iIzM4YmRmOCIvPjxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDEyIDEyKSBzY2FsZSgwLjg1KSB0cmFuc2xhdGUoLTEyIC0xMikiPjxwYXRoIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGQ9Ik0xMiAxNi41VjkuNzVtMCAwbDMgM20tMy0zbC0zIDNNNi43NSAxOS41YTQuNSA0LjUgMCAwMS0xLjQxLTguNzc1IDUuMjUgNS4yNSAwIDAxMTAuMjMzLTIuMzMgMyAzIDAgMDEzLjc1OCAzLjg0OEEzLjc1MiAzLjc1MiAwIDAxMTggMTkuNUg2Ljc1eiIvPjwvZz48L3N2Zz4=">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg-primary:#0a0a12;
  --bg-secondary:#0f0f1a;
  --bg-card:rgba(17,17,28,0.9);
  --bg-input:#141424;
  --border:rgba(255,255,255,0.08);
  --border-focus:rgba(56,189,248,0.4);
  --text-primary:#f5f5f7;
  --text-secondary:#a1a1aa;
  --text-muted:#71717a;
  --accent:#38bdf8;
  --accent-glow:rgba(56,189,248,0.2);
  --success:#22c55e;
  --success-bg:rgba(34,197,94,0.08);
  --warning:#f59e0b;
  --warning-bg:rgba(245,158,11,0.08);
  --error:#ef4444;
  --error-bg:rgba(239,68,68,0.08);
  --info:#3b82f6;
  --info-bg:rgba(59,130,246,0.08);
}

html,body{
  height:100%;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  overflow-x:hidden;
  line-height:1.6;
}

/* Subtle noise texture */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  opacity:0.03;
  pointer-events:none;
  z-index:0;
}

.container{
  position:relative;
  z-index:1;
  max-width:800px;
  margin:0 auto;
  padding:60px 32px 80px;
  min-height:100vh;
}

/* Header */
.header{
  text-align:center;
  margin-bottom:56px;
}
.header .logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:72px;
  height:72px;
  border-radius:20px;
  background:var(--accent);
  margin-bottom:20px;
  box-shadow:0 12px 40px var(--accent-glow);
}
.header .logo svg{width:32px;height:32px;color:#fff}
.header h1{
  font-family:'Space Grotesk',system-ui;
  font-size:32px;
  font-weight:600;
  letter-spacing:-0.5px;
  color:var(--accent);
  margin-bottom:8px;
}
.header p{
  font-size:14px;
  color:var(--text-secondary);
  letter-spacing:0.3px;
}

/* Card */
.card{
  background:var(--bg-card);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px;
  margin-bottom:24px;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
  transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
}
.card:hover{
  border-color:rgba(255,255,255,0.12);
  transform:translateY(-2px);
  box-shadow:0 12px 48px rgba(0,0,0,0.4);
}

/* Form */
.field{margin-bottom:24px}
.field label{
  display:block;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--text-secondary);
  margin-bottom:10px;
}
.field input{
  width:100%;
  padding:16px 20px;
  background:var(--bg-input);
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text-primary);
  font-size:15px;
  font-family:inherit;
  outline:none;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.field input:focus{
  border-color:var(--border-focus);
  box-shadow:0 0 0 4px var(--accent-glow);
  background:rgba(20,20,36,0.8);
}
.field input::placeholder{color:var(--text-muted)}

/* Button */
.btn-sync{
  width:100%;
  padding:16px 28px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-family:'Space Grotesk',system-ui;
  font-size:16px;
  font-weight:600;
  letter-spacing:0.3px;
  color:#fff;
  background:var(--accent);
  box-shadow:0 6px 24px var(--accent-glow);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  position:relative;
  overflow:hidden;
}
.btn-sync:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 10px 32px var(--accent-glow);
}
.btn-sync:active:not(:disabled){transform:translateY(0)}
.btn-sync:disabled{opacity:0.6;cursor:not-allowed;filter:grayscale(0.2)}

/* Status Badge */
.status{
  display:none;
  align-items:center;
  gap:12px;
  padding:16px 20px;
  border-radius:14px;
  font-size:14px;
  font-weight:500;
  margin-bottom:24px;
  animation:slideIn 0.4s cubic-bezier(0.4,0,0.2,1);
}
.status.visible{display:flex}
.status .dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex-shrink:0;
}
.status.syncing{background:var(--warning-bg);color:var(--warning)}
.status.syncing .dot{background:var(--warning);animation:pulse 1.8s infinite}
.status.done{background:var(--success-bg);color:var(--success)}
.status.done .dot{background:var(--success)}
.status.error{background:var(--error-bg);color:var(--error)}
.status.error .dot{background:var(--error)}
.status.info{background:var(--info-bg);color:var(--info)}
.status.info .dot{background:var(--info)}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.4;transform:scale(0.9)}
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(-12px)}
  to{opacity:1;transform:translateY(0)}
}

/* Progress bar */
.progress-wrap{
  display:none;
  margin-bottom:20px;
}
.progress-wrap.visible{display:block}
.progress-bar-bg{
  width:100%;
  height:8px;
  border-radius:4px;
  background:var(--bg-input);
  overflow:hidden;
}
.progress-bar{
  height:100%;
  border-radius:4px;
  background:var(--accent);
  width:0%;
  transition:width 0.5s cubic-bezier(0.4,0,0.2,1);
}
.progress-label{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  font-size:12px;
  color:var(--text-secondary);
  letter-spacing:0.2px;
}

/* Stats row */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:24px;
}
.stat{
  text-align:center;
  padding:20px 12px;
  background:var(--bg-input);
  border-radius:14px;
  border:1px solid var(--border);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.stat:hover{
  border-color:rgba(255,255,255,0.12);
  transform:translateY(-2px);
}
.stat .value{
  font-family:'Space Grotesk',system-ui;
  font-size:28px;
  font-weight:600;
  color:var(--accent);
}
.stat .label{
  font-size:11px;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-top:6px;
}

/* Log panel */
.log-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.log-header h3{
  font-size:14px;
  font-weight:600;
  color:var(--text-secondary);
  letter-spacing:0.3px;
}
.log-header button{
  background:none;
  border:1px solid var(--border);
  color:var(--text-muted);
  font-size:11px;
  padding:6px 14px;
  border-radius:8px;
  cursor:pointer;
  font-family:inherit;
  transition:all 0.2s;
  letter-spacing:0.3px;
}
.log-header button:hover{
  border-color:var(--text-muted);
  color:var(--text-secondary);
  background:rgba(255,255,255,0.02);
}

.log-panel{
  background:var(--bg-input);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  max-height:420px;
  overflow-y:auto;
  font-family:'SF Mono','Fira Code','JetBrains Mono',monospace;
  font-size:12px;
  line-height:1.9;
  color:var(--text-secondary);
  scroll-behavior:smooth;
}
.log-panel::-webkit-scrollbar{width:8px}
.log-panel::-webkit-scrollbar-track{background:transparent}
.log-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px}
.log-panel::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}

/* Log line coloring */
.log-line{white-space:pre-wrap;word-break:break-all}
.log-line.downloaded{color:#22c55e}
.log-line.skip{color:var(--text-muted)}
.log-line.error{color:#ef4444}
.log-line.info{color:#3b82f6}
.log-line.folder{color:#a78bfa}
.log-line.system{color:#f59e0b}
.log-line.done{color:#22c55e;font-weight:600}
.log-line.fail{color:#ef4444;font-weight:600}

/* Connection indicator */
.connection{
  position:fixed;
  top:20px;
  right:20px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--text-muted);
  padding:8px 16px;
  border-radius:24px;
  background:var(--bg-card);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  z-index:100;
  transition:all 0.3s;
}
.connection:hover{border-color:rgba(255,255,255,0.12)}
.connection .indicator{
  width:8px;
  height:8px;
  border-radius:50%;
}
.connection.connected .indicator{background:var(--success)}
.connection.disconnected .indicator{background:var(--error);animation:pulse 1.2s infinite}

/* Responsive */
@media(max-width:640px){
  .container{padding:40px 20px 60px}
  .card{padding:28px}
  .stats{grid-template-columns:repeat(3,1fr);gap:10px}
  .header h1{font-size:26px}
  .stat .value{font-size:24px}
}
</style>
</head>

<body>

<div class="connection disconnected" id="conn">
  <span class="indicator"></span>
  <span id="connText">Connecting...</span>
</div>

<div class="container">

  <div class="header">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
      </svg>
    </div>
    <h1>Drive Sync</h1>
    <p>Professional Google Drive Backup Dashboard</p>
  </div>

  <div class="card">
    <div class="field">
      <label>Google Drive Folder</label>
      <input id="folder" placeholder="Paste folder ID or full Google Drive URL..." autocomplete="off">
    </div>
    <div class="field">
      <label>Local Target Directory</label>
      <input id="target" value="./downloads" placeholder="./downloads" autocomplete="off">
    </div>
    <button class="btn-sync" id="btn" onclick="start()">
      Start Sync
    </button>
  </div>

  <div class="status" id="status">
    <span class="dot"></span>
    <span id="statusText"></span>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label">
      <span id="progressText">0 / 0</span>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <div class="stats" id="statsRow" style="display:none">
    <div class="stat">
      <div class="value" id="statDownloaded">0</div>
      <div class="label">Downloaded</div>
    </div>
    <div class="stat">
      <div class="value" id="statSkipped">0</div>
      <div class="label">Skipped</div>
    </div>
    <div class="stat">
      <div class="value" id="statErrors">0</div>
      <div class="label">Errors</div>
    </div>
  </div>

  <div class="card" id="logCard" style="display:none">
    <div class="log-header">
      <h3>Activity Log</h3>
      <button onclick="clearLog()">Clear</button>
    </div>
    <div class="log-panel" id="log"></div>
  </div>

</div>

<script>
let ws;
let syncing = false;
let downloaded = 0, skipped = 0, errors = 0;
let totalFiles = 0, currentFile = 0;

function connectWs() {
  ws = new WebSocket("ws://" + location.host + "/logs");
  ws.onopen = () => {
    setConnection(true);
  };
  ws.onclose = () => {
    setConnection(false);
    setTimeout(connectWs, 2000);
  };
  ws.onerror = () => {};
  ws.onmessage = e => {
    const msg = e.data;
    handleMessage(msg);
  };
}

function setConnection(connected) {
  const el = document.getElementById("conn");
  const txt = document.getElementById("connText");
  if (connected) {
    el.className = "connection connected";
    txt.textContent = "Connected";
  } else {
    el.className = "connection disconnected";
    txt.textContent = "Reconnecting...";
  }
}

function handleMessage(msg) {
  document.getElementById("logCard").style.display = "block";
  document.getElementById("statsRow").style.display = "grid";

  // Parse progress [X/Y]
  const progressMatch = msg.match(/^\[(\d+)\/(\d+)\]/);
  if (progressMatch) {
    currentFile = parseInt(progressMatch[1]);
    totalFiles = parseInt(progressMatch[2]);
    updateProgress();
  }

  // Count stats
  if (msg.includes("✅")) { downloaded++; }
  else if (msg.includes("⏭")) { skipped++; }
  else if (msg.includes("❌")) { errors++; }

  updateStats();

  // Determine log line class
  let cls = "";
  if (msg.includes("✅")) cls = "downloaded";
  else if (msg.includes("⏭")) cls = "skip";
  else if (msg.includes("❌") || msg.includes("[FAIL]")) cls = "error";
  else if (msg.includes("📁")) cls = "folder";
  else if (msg.startsWith("[INFO]")) cls = "info";
  else if (msg.startsWith("[SYNC]") || msg.startsWith("[RETRY]")) cls = "system";
  else if (msg.startsWith("[DONE]")) cls = "done";
  else if (msg.startsWith("[ERROR]")) cls = "fail";

  appendLog(msg, cls);

  // Status updates
  if (msg.startsWith("[DONE]")) {
    setSyncing(false);
    setStatus("done", "Sync completed successfully!");
    updateProgress(100);
  } else if (msg.startsWith("[ERROR]")) {
    setSyncing(false);
    setStatus("error", "All retry attempts failed");
  } else if (msg.startsWith("[FAIL]")) {
    setStatus("error", msg.replace("[FAIL] ", ""));
  } else if (msg.startsWith("[RETRY]")) {
    setStatus("syncing", msg.replace("[RETRY] ", ""));
  } else if (msg.startsWith("[SYNC]")) {
    setStatus("syncing", msg.replace("[SYNC] ", ""));
  }
}

function appendLog(msg, cls) {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "log-line" + (cls ? " " + cls : "");
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function updateProgress(overridePct) {
  const wrap = document.getElementById("progressWrap");
  wrap.classList.add("visible");
  const pct = overridePct !== undefined ? overridePct : (totalFiles > 0 ? Math.round((currentFile / totalFiles) * 100) : 0);
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressText").textContent = currentFile + " / " + totalFiles;
  document.getElementById("progressPct").textContent = pct + "%";
}

function updateStats() {
  document.getElementById("statDownloaded").textContent = downloaded;
  document.getElementById("statSkipped").textContent = skipped;
  document.getElementById("statErrors").textContent = errors;
}

function setStatus(type, msg) {
  const el = document.getElementById("status");
  el.className = "status visible " + type;
  document.getElementById("statusText").textContent = msg;
}

function setSyncing(val) {
  syncing = val;
  const btn = document.getElementById("btn");
  btn.disabled = val;
  btn.textContent = val ? "Syncing..." : "Start Sync";
}

function clearLog() {
  document.getElementById("log").innerHTML = "";
}

async function start() {
  if (syncing) return;

  // Reset counters
  downloaded = 0; skipped = 0; errors = 0;
  currentFile = 0; totalFiles = 0;
  updateStats();
  clearLog();

  setSyncing(true);
  setStatus("syncing", "Initializing sync...");
  document.getElementById("logCard").style.display = "block";
  document.getElementById("statsRow").style.display = "grid";
  document.getElementById("progressWrap").classList.add("visible");
  document.getElementById("progressBar").style.width = "0%";

  await fetch("/sync", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      folderId: document.getElementById("folder").value,
      target: document.getElementById("target").value
    })
  });
}

connectWs();
</script>

</body>
</html>
